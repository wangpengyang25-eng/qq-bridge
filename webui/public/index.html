<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大肥鱼控制台 · 群友档案</title>
<link rel="stylesheet" href="/style.css">
<script>
  // 在首帧之前定好主题，避免闪一下白/黑
  try {
    if (localStorage.getItem('qqb-theme') === 'dark') document.documentElement.dataset.theme = 'dark';
  } catch (e) { /* 隐私模式下 localStorage 可能抛错，忽略 */ }
</script>
</head>
<body>
<div class="glow" aria-hidden="true"></div>

<header class="top">
  <div class="identity">
    <div class="avatar avatar-bot" id="botAvatar">鱼</div>
    <div>
      <h1>群友档案</h1>
      <p class="tagline">谁熟、谁冷、下次该找谁说话</p>
    </div>
  </div>
  <div class="top-actions">
    <button class="sm ghost" id="themeBtn" title="切换明暗">深色</button>
    <div class="status" id="status">连接中…</div>
  </div>
</header>

<section class="overview" id="overview"></section>

<main class="layout">
  <section class="card list-card">
    <div class="card-head">
      <h2>群友 <span class="count" id="memberCount">0</span></h2>
      <button class="ghost sm" id="sortBtn" data-mode="affinity">亲密度 ↓</button>
    </div>
    <ul class="member-list" id="memberList"></ul>
  </section>

  <section class="card detail-card" id="detail">
    <div class="empty">
      <div class="ghost-art">◎</div>
      <p>左边选一个群友</p>
      <span class="hint">这里会显示亲密度是怎么算出来的、你给它的备注，以及要不要让它主动找这个人说话。</span>
    </div>
  </section>
</main>

<section class="card wide">
  <div class="card-head">
    <h2>主动搭话候选</h2>
    <span class="hint">越熟、越久没聊、越少被打扰的越靠前</span>
  </div>
  <ol class="candidates" id="candidates"></ol>
</section>

<footer>
  <span id="env">—</span>
  <span class="sep">·</span>
  <span>数据仅存本机 <code>data/members.json</code></span>
</footer>

<script src="/app.js" type="module"></script>
</body>
</html>
